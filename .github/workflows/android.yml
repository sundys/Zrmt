name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs (armeabi-v7a / arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        env:
          ZRMT_KEYSTORE_BASE64: ${{ secrets.ZRMT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ZRMT_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$ZRMT_KEYSTORE_BASE64" | base64 -d > app/keystore/zrmt.keystore
            echo "签名密钥已从 Secrets 恢复"
          else
            echo "::warning::未设置 ZRMT_KEYSTORE_BASE64，本次将产出未签名的 release APK"
          fi

      - name: Build release APKs
        env:
          ZRMT_KEYSTORE_PASSWORD: ${{ secrets.ZRMT_KEYSTORE_PASSWORD }}
          ZRMT_KEY_ALIAS: ${{ secrets.ZRMT_KEY_ALIAS }}
          ZRMT_KEY_PASSWORD: ${{ secrets.ZRMT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zrmt-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: Zrmt-apks-${{ github.sha }}
          path: apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
