plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sundys.zrmt'
    compileSdk 34

    defaultConfig {
        applicationId "com.sundys.zrmt"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.1.1"
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    // 签名信息优先从环境变量读取（CI 用 Secrets 注入），缺省回退到本地 keystore 与默认口令
    def ksFile = file(System.getenv("ZRMT_KEYSTORE_FILE") ?: "keystore/zrmt.keystore")

    signingConfigs {
        release {
            storeFile ksFile
            storePassword System.getenv("ZRMT_KEYSTORE_PASSWORD") ?: "zrmt123456"
            keyAlias System.getenv("ZRMT_KEY_ALIAS") ?: "zrmt"
            keyPassword System.getenv("ZRMT_KEY_PASSWORD") ?: "zrmt123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
